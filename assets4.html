<style>
  :root {
    --bg-0:    #07090F;
    --bg-1:    #0D1119;
    --bg-2:    #131825;
    --glass:   rgba(255,255,255,.035);
    --glass-2: rgba(255,255,255,.07);
    --border:  rgba(255,255,255,.07);
    --border-strong: rgba(255,255,255,.14);

    --gold:   #D4A574;
    --gold-l: #F2D7A7;
    --gold-d: #B08A57;
    --mint:   #6EE7B7;
    --rose:   #FCA5A5;
    --sky:    #93C5FD;
    --violet: #C4B5FD;

    --text:   #F1F5F9;
    --text-2: #CBD5E1;
    --muted:  #64748B;
    --dim:    #475569;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html, body {
    background: var(--bg-0);
    color: var(--text);
    font-family: 'IBM Plex Sans Thai', 'Sora', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ════════════════════════════════════════════════
     ANIMATED MESH BACKGROUND
  ═══════════════════════════════════════════════ */
  .bg-mesh {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    overflow: hidden;
  }
  .bg-orb {
    position: absolute; border-radius: 50%;
    filter: blur(120px); opacity: .45;
    will-change: transform;
  }
  .bg-orb.a { width: 600px; height: 600px; background: #D4A57440; top: -10%; left: -10%; animation: orbA 22s ease-in-out infinite; }
  .bg-orb.b { width: 500px; height: 500px; background: #6EE7B730; bottom: -15%; right: -10%; animation: orbB 26s ease-in-out infinite; }
  .bg-orb.c { width: 400px; height: 400px; background: #93C5FD30; top: 50%; left: 50%; animation: orbC 30s ease-in-out infinite; }
  @keyframes orbA {
    0%,100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(200px, 150px) scale(1.1); }
  }
  @keyframes orbB {
    0%,100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(-150px, -100px) scale(1.15); }
  }
  @keyframes orbC {
    0%,100% { transform: translate(-50%,-50%) scale(1); }
    50% { transform: translate(-50%,-50%) scale(1.4) rotate(180deg); }
  }
  /* Grain overlay */
  .bg-grain {
    position: fixed; inset: 0; pointer-events: none; z-index: 1;
    opacity: .04;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='1'/></svg>");
    mix-blend-mode: overlay;
  }

  /* ════════════════════════════════════════════════
     LAYOUT
  ═══════════════════════════════════════════════ */
  .vault {
    position: relative; z-index: 2;
    max-width: 1400px; margin: 0 auto;
    padding: 28px 32px 120px;
  }

  /* ── Top bar ── */
  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 40px;
    gap: 14px; flex-wrap: wrap;
  }
  .brand {
    display: flex; align-items: center; gap: 14px;
  }
  .brand-logo {
    width: 44px; height: 44px; border-radius: 12px;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-d) 100%);
    display: flex; align-items: center; justify-content: center;
    box-shadow:
      0 0 0 1px rgba(212,165,116,.3),
      0 8px 24px rgba(212,165,116,.2);
    font-family: 'Sora'; font-weight: 700; font-size: .9rem;
    color: var(--bg-0); letter-spacing: -.02em;
  }
  .brand-text {
    font-family: 'Sora'; font-weight: 600; font-size: 1.05rem;
    letter-spacing: -.01em; line-height: 1.1;
  }
  .brand-text .sub {
    font-size: .68rem; opacity: .55; letter-spacing: .2em;
    text-transform: uppercase; margin-top: 1px; font-weight: 500;
  }
  .topbar-right {
    display: flex; align-items: center; gap: 10px;
  }
  .pill-btn {
    padding: 9px 14px; border-radius: 12px;
    background: var(--glass); border: 1px solid var(--border);
    color: var(--text-2); cursor: pointer;
    font-family: inherit; font-weight: 500; font-size: .82rem;
    transition: all .2s;
    display: inline-flex; align-items: center; gap: 8px;
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  }
  .pill-btn:hover { background: var(--glass-2); color: var(--text); border-color: var(--border-strong); }
  .client-select-wrap {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 8px 6px 14px;
    background: var(--glass); border: 1px solid var(--border);
    border-radius: 12px; backdrop-filter: blur(20px);
  }
  .client-select-wrap .av {
    width: 26px; height: 26px; border-radius: 7px;
    background: linear-gradient(135deg, var(--gold), var(--gold-d));
    color: var(--bg-0); display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: .8rem; font-family: 'Sora';
  }
  .client-select-wrap select {
    background: transparent; border: none; color: var(--text);
    font-family: inherit; font-weight: 600; font-size: .9rem;
    padding: 4px 8px; outline: none; cursor: pointer;
  }
  .client-select-wrap select option {
    background: var(--bg-1); color: var(--text);
  }

  /* ════════════════════════════════════════════════
     HERO — Massive Wealth Display
  ═══════════════════════════════════════════════ */
  .hero {
    position: relative;
    padding: 60px 20px 40px;
    text-align: center;
    margin-bottom: 40px;
  }
  .hero-eyebrow {
    font-family: 'Sora';
    font-size: .76rem; font-weight: 600;
    letter-spacing: .35em; text-transform: uppercase;
    color: var(--gold); margin-bottom: 18px;
    opacity: .9;
  }
  .hero-total {
    font-family: 'Sora';
    font-size: clamp(3.5rem, 9vw, 7rem);
    font-weight: 700;
    line-height: 1; letter-spacing: -.04em;
    background: linear-gradient(180deg, #FFFFFF 0%, #F2D7A7 50%, #D4A574 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 24px;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 80px rgba(212,165,116,.2);
  }
  .hero-total .currency {
    font-size: .5em; opacity: .7;
    vertical-align: super;
    margin-right: .1em;
  }
  .hero-trend {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 8px 18px;
    background: var(--glass); border: 1px solid var(--border);
    border-radius: 50px;
    font-family: 'Sora'; font-size: .9rem; font-weight: 600;
    backdrop-filter: blur(20px);
  }
  .hero-trend .arrow {
    width: 24px; height: 24px; border-radius: 50%;
    background: linear-gradient(135deg, var(--mint), #34D399);
    color: var(--bg-0); display: inline-flex;
    align-items: center; justify-content: center;
    font-weight: 800;
  }
  .hero-trend .pct { color: var(--mint); }
  .hero-trend .text { color: var(--text-2); }

  /* ════════════════════════════════════════════════
     BENTO GRID — Top Stats
  ═══════════════════════════════════════════════ */
  .bento {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    grid-auto-rows: minmax(120px, auto);
    gap: 14px;
    margin-bottom: 48px;
  }
  .bento-cell {
    background: var(--glass);
    backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 24px;
    position: relative; overflow: hidden;
    transition: all .35s cubic-bezier(.2,.9,.3,1.05);
  }
  .bento-cell::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at 20% 0%, var(--accent-color, transparent), transparent 60%);
    opacity: .15; pointer-events: none;
  }
  .bento-cell:hover {
    border-color: var(--border-strong);
    transform: translateY(-3px);
    box-shadow: 0 20px 40px rgba(0,0,0,.3);
  }

  /* Bento sizing */
  .cell-donut { grid-column: span 5; grid-row: span 2; --accent-color: var(--gold); }
  .cell-savings { grid-column: span 4; --accent-color: var(--gold-l); }
  .cell-invest { grid-column: span 3; --accent-color: var(--sky); }
  .cell-fv { grid-column: span 4; --accent-color: var(--mint); }
  .cell-cf { grid-column: span 3; --accent-color: var(--violet); }

  @media (max-width: 1024px) {
    .cell-donut { grid-column: span 12; grid-row: span 1; }
    .cell-savings, .cell-invest, .cell-fv, .cell-cf { grid-column: span 6; }
  }
  @media (max-width: 600px) {
    .cell-donut, .cell-savings, .cell-invest, .cell-fv, .cell-cf { grid-column: span 12; }
  }

  .cell-eyebrow {
    font-family: 'Sora'; font-size: .68rem;
    font-weight: 600; letter-spacing: .2em;
    text-transform: uppercase; color: var(--text-2);
    opacity: .65; margin-bottom: 6px;
  }
  .cell-value {
    font-family: 'Sora'; font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -.02em;
  }
  .cell-value.lg { font-size: 2rem; line-height: 1.1; }
  .cell-value.md { font-size: 1.5rem; line-height: 1.1; }
  .cell-sub {
    font-size: .82rem; color: var(--muted); margin-top: 6px;
  }
  .cell-sub b { color: var(--text-2); font-weight: 600; }

  /* Donut cell */
  .cell-donut {
    display: grid; grid-template-columns: auto 1fr; gap: 24px;
    align-items: center;
  }
  @media (max-width: 600px) {
    .cell-donut { grid-template-columns: 1fr; text-align: center; }
  }
  .donut-svg {
    width: 180px; height: 180px;
    filter: drop-shadow(0 8px 20px rgba(212,165,116,.2));
  }
  .donut-svg svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .donut-arc {
    fill: none; stroke-width: 14; stroke-linecap: round;
    transition: stroke-dashoffset 1.8s cubic-bezier(.2,.9,.3,1.05);
  }
  .donut-legend {
    display: flex; flex-direction: column; gap: 10px;
  }
  .donut-row {
    display: grid; grid-template-columns: 14px 1fr auto auto; gap: 10px;
    align-items: center; font-size: .9rem;
  }
  .donut-row .dot { width: 10px; height: 10px; border-radius: 3px; }
  .donut-row .lbl { color: var(--text-2); }
  .donut-row .val {
    font-family: 'Sora'; font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .donut-row .pct {
    font-family: 'JetBrains Mono'; font-size: .76rem;
    color: var(--muted); min-width: 42px; text-align: right;
  }

  /* ════════════════════════════════════════════════
     SECTION DIVIDER
  ═══════════════════════════════════════════════ */
  .section-divider {
    display: flex; align-items: center; gap: 20px;
    margin: 48px 0 24px;
  }
  .section-num {
    font-family: 'Sora'; font-weight: 600;
    color: var(--gold); font-size: .9rem;
    font-variant-numeric: tabular-nums;
    letter-spacing: .1em;
  }
  .section-title {
    font-family: 'Sora'; font-weight: 600;
    font-size: 1.4rem; color: var(--text);
    letter-spacing: -.01em;
  }
  .section-line {
    flex: 1; height: 1px;
    background: linear-gradient(90deg, var(--border-strong), transparent);
  }
  .section-action {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: 50px;
    background: var(--glass); border: 1px solid var(--border);
    color: var(--text-2); cursor: pointer;
    font-family: inherit; font-weight: 500; font-size: .78rem;
    transition: all .2s; backdrop-filter: blur(20px);
  }
  .section-action:hover { color: var(--gold); border-color: var(--gold); }

  /* ════════════════════════════════════════════════
     ASSET CARDS GRID
  ═══════════════════════════════════════════════ */
  .asset-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
  }
  .asset-card {
    position: relative;
    border-radius: 20px;
    padding: 22px;
    background:
      linear-gradient(135deg, var(--card-grad-1, rgba(255,255,255,.04)), var(--card-grad-2, rgba(255,255,255,.02))),
      var(--bg-1);
    border: 1px solid var(--border);
    backdrop-filter: blur(40px);
    overflow: hidden;
    cursor: pointer;
    transition: all .4s cubic-bezier(.2,.9,.3,1.05);
    isolation: isolate;
  }
  /* Subtle hover sheen */
  .asset-card::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at var(--mx,50%) var(--my,50%), rgba(255,255,255,.06), transparent 40%);
    pointer-events: none; opacity: 0; transition: opacity .3s;
    z-index: 0;
  }
  .asset-card:hover::before { opacity: 1; }
  .asset-card:hover {
    border-color: var(--card-accent, var(--gold));
    transform: translateY(-4px);
    box-shadow:
      0 0 0 1px var(--card-accent, var(--gold)),
      0 24px 50px rgba(0,0,0,.45),
      0 0 60px var(--card-glow, transparent);
  }

  /* Category accent per asset type */
  .asset-card[data-cat="savings"] { --card-grad-1: rgba(212,165,116,.08); --card-grad-2: rgba(176,138,87,.03); --card-accent: var(--gold); --card-glow: rgba(212,165,116,.15); }
  .asset-card[data-cat="invest"]  { --card-grad-1: rgba(147,197,253,.08); --card-grad-2: rgba(96,165,250,.03); --card-accent: var(--sky);  --card-glow: rgba(147,197,253,.15); }
  .asset-card[data-cat="custom"]  { --card-grad-1: rgba(196,181,253,.08); --card-grad-2: rgba(167,139,250,.03); --card-accent: var(--violet); --card-glow: rgba(196,181,253,.15); }

  .asset-card.expanded {
    grid-column: 1 / -1;
    background: linear-gradient(135deg, rgba(255,255,255,.06), rgba(255,255,255,.02)), var(--bg-1);
    border-color: var(--card-accent);
    box-shadow: 0 0 0 1px var(--card-accent), 0 30px 80px rgba(0,0,0,.5);
  }

  .asset-head {
    display: flex; align-items: center; gap: 14px;
    position: relative; z-index: 1;
  }
  .asset-glyph {
    width: 52px; height: 52px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem;
    background: var(--bg-2);
    border: 1px solid var(--border);
    color: var(--card-accent);
    transition: all .3s;
  }
  .asset-card:hover .asset-glyph {
    background: var(--card-accent);
    color: var(--bg-0);
    transform: scale(1.06) rotate(-6deg);
  }
  .asset-title-wrap { flex: 1; min-width: 0; }
  .asset-title {
    font-family: 'Sora'; font-weight: 600;
    font-size: 1rem; line-height: 1.2;
    color: var(--text); margin-bottom: 4px;
    overflow: hidden; text-overflow: ellipsis;
    display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .asset-tags {
    display: flex; gap: 5px; flex-wrap: wrap;
  }
  .asset-tag {
    font-family: 'Sora'; font-size: .65rem;
    padding: 2px 8px; border-radius: 50px;
    background: var(--glass-2); color: var(--text-2);
    font-weight: 500; letter-spacing: .04em;
  }
  .asset-tag.applied {
    background: var(--card-accent);
    color: var(--bg-0); font-weight: 700;
  }

  .asset-value-row {
    margin-top: 20px; position: relative; z-index: 1;
  }
  .asset-value-row .lbl {
    font-family: 'Sora'; font-size: .65rem;
    font-weight: 500; letter-spacing: .15em;
    text-transform: uppercase; color: var(--muted);
    margin-bottom: 4px;
  }
  .asset-value-amt {
    font-family: 'Sora'; font-weight: 700;
    font-size: 1.7rem; line-height: 1;
    font-variant-numeric: tabular-nums; letter-spacing: -.02em;
    color: var(--text);
  }
  .asset-value-amt.empty { color: var(--dim); font-weight: 500; font-size: 1rem; }

  .asset-progress {
    margin-top: 14px; height: 3px;
    background: rgba(255,255,255,.05);
    border-radius: 2px; overflow: hidden;
    position: relative; z-index: 1;
  }
  .asset-progress-fill {
    height: 100%; border-radius: 2px;
    background: linear-gradient(90deg, var(--card-accent), transparent);
    transition: width 1.4s cubic-bezier(.2,.9,.3,1.05);
  }

  .asset-stats {
    margin-top: 14px;
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    padding-top: 14px;
    border-top: 1px dashed var(--border);
    position: relative; z-index: 1;
  }
  .stat-mini { min-width: 0; }
  .stat-mini .l {
    font-size: .62rem; color: var(--muted);
    font-weight: 600; letter-spacing: .08em;
    text-transform: uppercase; margin-bottom: 2px;
  }
  .stat-mini .v {
    font-family: 'Sora'; font-weight: 700;
    font-size: .88rem; color: var(--text);
    font-variant-numeric: tabular-nums;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .stat-mini .v.dim { color: var(--dim); font-weight: 400; }
  .stat-mini .v.mint { color: var(--mint); }

  /* ════════════════════════════════════════════════
     EXPANDED EDITOR (inside card)
  ═══════════════════════════════════════════════ */
  .editor {
    display: none;
    margin-top: 22px; padding-top: 22px;
    border-top: 1px solid var(--border);
    position: relative; z-index: 1;
  }
  .asset-card.expanded .editor { display: block; animation: edIn .3s ease-out; }
  .asset-card.expanded .asset-stats { display: none; }
  @keyframes edIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .editor-fields {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
  }
  .ed-field {
    display: flex; flex-direction: column; gap: 6px;
  }
  .ed-field label {
    font-family: 'Sora'; font-size: .68rem;
    font-weight: 600; letter-spacing: .12em;
    text-transform: uppercase; color: var(--muted);
  }
  .ed-input-wrap {
    position: relative; display: flex; align-items: center;
  }
  .ed-input {
    width: 100%; padding: 12px 14px;
    background: var(--bg-0);
    border: 1px solid var(--border);
    border-radius: 12px; outline: none;
    font-family: 'Sora'; font-weight: 600;
    font-size: 1.05rem; color: var(--text);
    font-variant-numeric: tabular-nums;
    text-align: right;
    transition: all .15s;
    box-sizing: border-box;
  }
  .ed-input:focus {
    border-color: var(--card-accent);
    background: var(--bg-1);
    box-shadow: 0 0 0 3px var(--card-glow);
  }
  .ed-input::placeholder { color: var(--dim); font-weight: 400; }
  .ed-suffix {
    position: absolute; right: 12px;
    color: var(--muted); font-size: .82rem;
    pointer-events: none; font-weight: 500;
  }
  .ed-input.has-suffix { padding-right: 32px; }

  .ed-name-input {
    width: 100%; margin-bottom: 18px; padding: 10px 14px;
    background: var(--bg-0);
    border: 1px dashed var(--border-strong);
    border-radius: 10px; outline: none;
    font-family: 'Sora'; font-size: .95rem; font-weight: 600;
    color: var(--text);
  }
  .ed-name-input:focus {
    border-style: solid; border-color: var(--card-accent);
    box-shadow: 0 0 0 3px var(--card-glow);
  }

  /* Live preview box */
  .ed-preview {
    margin-top: 18px;
    padding: 18px 22px;
    background: linear-gradient(135deg,
      rgba(110,231,183,.08) 0%,
      rgba(52,211,153,.04) 100%);
    border: 1px solid rgba(110,231,183,.2);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap;
  }
  .ed-preview.cf {
    background: linear-gradient(135deg, rgba(147,197,253,.08), rgba(96,165,250,.04));
    border-color: rgba(147,197,253,.2);
  }
  .ed-preview .info { min-width: 0; }
  .ed-preview .lbl {
    font-family: 'Sora'; font-size: .66rem;
    font-weight: 600; letter-spacing: .15em;
    text-transform: uppercase; color: var(--mint);
    margin-bottom: 4px;
  }
  .ed-preview.cf .lbl { color: var(--sky); }
  .ed-preview .amt {
    font-family: 'Sora'; font-weight: 700;
    font-size: 1.8rem; line-height: 1;
    color: var(--mint); letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
    transition: transform .3s;
  }
  .ed-preview.cf .amt { color: var(--sky); }
  .ed-preview .amt.pulse { animation: amtPulse .4s ease-out; }
  @keyframes amtPulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.06); }

  .ed-preview .meta {
    font-size: .8rem; color: var(--text-2);
  }

  /* Apply pills */
  .apply-row {
    margin-top: 18px; padding-top: 18px;
    border-top: 1px dashed var(--border);
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
  }
  .apply-row label {
    font-family: 'Sora'; font-size: .68rem;
    font-weight: 600; letter-spacing: .12em;
    text-transform: uppercase; color: var(--muted);

  }
  .apply-pill {
    padding: 7px 16px; border-radius: 50px;

    background: var(--card-accent);

  /* Editor actions */
  .ed-actions {
    margin-top: 18px;
    display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap;

  .ed-btn {
    padding: 10px 20px; border-radius: 12px; border: none;

  /* ════════════════════════════════════════════════
     ADD CUSTOM BUTTONS
  ═══════════════════════════════════════════════ */
  .add-zone {
    margin-top: 24px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
  }
  @media (max-width: 600px) { .add-zone { grid-template-columns: 1fr; } }
  .add-card {
    padding: 22px 24px;
    background: var(--glass);
    border: 1.5px dashed var(--border-strong);
    border-radius: 18px; cursor: pointer;
    transition: all .3s;
    display: flex; align-items: center; gap: 16px;
    color: var(--text-2);
    backdrop-filter: blur(20px);
  }
  .add-card .icon {
    width: 48px; height: 48px; border-radius: 14px;
    background: var(--bg-2);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem;
    transition: all .3s;
  }
  .add-card .text { display: flex; flex-direction: column; gap: 2px; }
  .add-card .t1 {
    font-family: 'Sora'; font-weight: 600; font-size: 1rem;
    color: var(--text);
  }
  .add-card .t2 {
    font-size: .78rem; color: var(--muted);
  }
  .add-card.fv:hover {
    border-color: var(--mint); transform: translateY(-3px);
    box-shadow: 0 12px 30px rgba(110,231,183,.15);
  }
  .add-card.fv:hover .icon { background: var(--mint); color: var(--bg-0); }
  .add-card.cf:hover {
    border-color: var(--sky); transform: translateY(-3px);
    box-shadow: 0 12px 30px rgba(147,197,253,.15);

  .add-card.cf:hover .icon { background: var(--sky); color: var(--bg-0); }

  /* ════════════════════════════════════════════════
     FLOATING DOCK
  ═══════════════════════════════════════════════ */
  .dock {
    position: fixed; bottom: 18px; left: 50%;
    transform: translateX(-50%);
    background: rgba(13,17,25,.85);
    backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
    border: 1px solid var(--border-strong);
    border-radius: 100px; padding: 8px 8px 8px 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
    display: flex; align-items: center; gap: 24px;
    z-index: 50;
    max-width: calc(100vw - 32px);
    overflow-x: auto;
  }
  .dock-item {
    display: flex; flex-direction: column; gap: 2px;
    white-space: nowrap;
  }
  .dock-item .l {
    font-family: 'Sora'; font-size: .58rem;
    color: var(--muted); letter-spacing: .15em;
    text-transform: uppercase; font-weight: 500;
  }
  .dock-item .v {
    font-family: 'Sora'; font-weight: 700;
    font-size: 1rem; color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .dock-item .v.gold { color: var(--gold); }
  .dock-item .v.mint { color: var(--mint); }
  .dock-divider {
    width: 1px; height: 24px; background: var(--border-strong);
  }
  .dock-actions { display: flex; gap: 6px; margin-left: auto; }
  .dock-btn {
    padding: 10px 18px; border-radius: 100px;
    border: none; cursor: pointer;
    font-family: inherit; font-weight: 600; font-size: .82rem;
    transition: all .2s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .dock-btn.ghost {
    background: var(--glass-2); color: var(--text-2);
  }
  .dock-btn.ghost:hover { color: var(--text); background: rgba(255,255,255,.12); }
  .dock-btn.next {
    background: linear-gradient(135deg, var(--gold), var(--gold-d));
    color: var(--bg-0);
  }
  .dock-btn.next:hover { transform: scale(1.04); }

  @media (max-width: 600px) {
    .dock { padding: 6px 14px; gap: 12px; }
    .dock-divider { display: none; }
    .dock-item .v { font-size: .88rem; }
    .vault { padding: 20px 16px 120px; }
  }

  /* Filter chips on grid header */
  .filter-row {
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    margin-bottom: 18px;
  }
  .filter-chip {
    padding: 8px 16px; border-radius: 50px;
    background: var(--glass); border: 1px solid var(--border);
    color: var(--text-2); cursor: pointer;
    font-family: inherit; font-weight: 500; font-size: .82rem;
    transition: all .2s;
    display: inline-flex; align-items: center; gap: 8px;
    backdrop-filter: blur(20px);
  }
  .filter-chip:hover { color: var(--text); border-color: var(--border-strong); }
  .filter-chip.active {
    background: var(--gold); color: var(--bg-0);
    border-color: transparent; font-weight: 600;
  }
  .filter-chip .ct {
    background: rgba(0,0,0,.15); padding: 1px 7px;
    border-radius: 50px; font-size: .7rem;
  }
  .filter-chip:not(.active) .ct {
    background: var(--glass-2); color: var(--muted);
  }
  .filter-spacer { flex: 1; }
  .filter-search {
    flex: 1; min-width: 200px; max-width: 300px;
    position: relative;
  }
  .filter-search input {
    width: 100%; padding: 9px 14px 9px 38px;
    background: var(--glass); border: 1px solid var(--border);
    border-radius: 50px; outline: none;
    font-family: inherit; font-size: .85rem; color: var(--text);
    transition: all .2s; backdrop-filter: blur(20px);
  }
  .filter-search input:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(212,165,116,.2);
  }
  .filter-search input::placeholder { color: var(--muted); }
  .filter-search::before {
    content: ''; position: absolute; left: 14px; top: 50%;
    transform: translateY(-50%);
    width: 12px; height: 12px;
    border: 1.5px solid var(--muted); border-radius: 50%;
    pointer-events: none;
  }
  .filter-search::after {
    content: ''; position: absolute; left: 23px; top: 65%;
    width: 5px; height: 1.5px; background: var(--muted);
    transform: rotate(45deg); pointer-events: none;
  }

  /* No client */
  .empty-state {
    text-align: center; padding: 80px 30px;
    background: var(--glass); border: 1px solid var(--border);
    border-radius: 24px; backdrop-filter: blur(40px);
    margin: 40px 0;
  }
  .empty-state .ico {
    font-size: 4rem; margin-bottom: 16px; opacity: .6;
  }
  .empty-state h3 {
    font-family: 'Sora'; font-weight: 600;
    font-size: 1.3rem; color: var(--text); margin-bottom: 8px;
  }
  .empty-state p {
    color: var(--text-2); margin-bottom: 22px;
  }
  .empty-state a {
    display: inline-block; padding: 12px 28px;
    background: linear-gradient(135deg, var(--gold), var(--gold-d));
    color: var(--bg-0); text-decoration: none;
    border-radius: 50px; font-weight: 700;
  }

  /* Animations */
  .fade-in {
    opacity: 0; transform: translateY(20px);
    animation: fIn .7s cubic-bezier(.2,.9,.3,1.05) forwards;
  }
  .fade-in.d1 { animation-delay: .1s; }
  .fade-in.d2 { animation-delay: .25s; }
  .fade-in.d3 { animation-delay: .4s; }
  .fade-in.d4 { animation-delay: .55s; }
  @keyframes fIn { to { opacity: 1; transform: translateY(0); } }

  .hidden { display: none !important; }
</style>

<script>
const _uid = localStorage.getItem('aia_currentUser');
if (!_uid) location.href = 'login.html';

function getUser() {
  const users = JSON.parse(localStorage.getItem('aia_users') || '[]');
  const u = users.find(x => x.id === _uid);
  if (!u) { localStorage.removeItem('aia_currentUser'); location.href = 'login.html'; return {}; }
  return u;
}
function updateUser(fn) {
  const users = JSON.parse(localStorage.getItem('aia_users') || '[]');
  const idx = users.findIndex(x => x.id === _uid);
  if (idx === -1) return;
  if (!users[idx].data) users[idx].data = {};
  fn(users[idx]);
  localStorage.setItem('aia_users', JSON.stringify(users));
}
function getClients() { return (getUser().data && getUser().data.clients) || []; }
function getCurrentClient() { return getClients().find(c => c.id === selectedClientId) || null; }
function getAssets() { const c = getCurrentClient(); return (c && c.assets) ? c.assets : []; }

const ASSET_TYPES = {
  deposit:    { icon:'💰', label:'เงินฝาก' },
  bond:       { icon:'📜', label:'ตราสารหนี้' },
  annuity:    { icon:'🛡️', label:'ประกันบำนาญ' },
  pvd:        { icon:'🏢', label:'PVD กองทุนสำรองฯ' },
  rmf:        { icon:'🌱', label:'RMF' },
  ltf:        { icon:'📈', label:'LTF' },
  ssf:        { icon:'🌿', label:'SSF' },
  thaiesg:    { icon:'🌍', label:'ThaiESG' },
  mutual:     { icon:'🏦', label:'กองทุนรวม' },
  unitlinked: { icon:'🔗', label:'Unit Linked' },
  realestate: { icon:'🏠', label:'อสังหาฯ ปล่อยเช่า' },
  stock:      { icon:'📊', label:'หุ้นสามัญ' },
  other:      { icon:'📦', label:'อื่นๆ' },
};
const SAVINGS_TYPES = ['deposit','bond','annuity'];
const INVESTMENT_TYPES = ['pvd','rmf','ltf','ssf','thaiesg','mutual','unitlinked','realestate','stock'];

const ROW_FIELDS_BY_TYPE = {
  _default:   { contrib: true,  term: true,  fv: true,  cashFlow: false },
  annuity:    { contrib: true,  term: false, fv: false, cashFlow: true  },
  realestate: { contrib: true,  term: false, fv: false, cashFlow: true  },
  pvd:        { contrib: false, term: true,  fv: true,  cashFlow: false },
};
function _rowFields(type) {
  return Object.assign({}, ROW_FIELDS_BY_TYPE._default, ROW_FIELDS_BY_TYPE[type] || {});
}

let selectedClientId = null;
let expandedId = null;
let currentFilter = 'all';

function calcFV(pv, rate, years, pmt, freq) {
  pv = Number(pv) || 0;
  rate = (Number(rate) || 0) / 100;
  years = Number(years) || 0;
  pmt = Number(pmt) || 0;
  if (years <= 0) return pv;
  if (freq === 'monthly' && pmt > 0) {
    const r_m = rate / 12; const n_m = years * 12;
    const factor_m = Math.pow(1 + r_m, n_m);
    if (r_m === 0) return pv + pmt * n_m;
    return pv * Math.pow(1 + rate, years) + pmt * (factor_m - 1) / r_m * (1 + r_m);
  }
  const factor = Math.pow(1 + rate, years);
  if (rate === 0) return pv + pmt * years;
  return pv * factor + pmt * (factor - 1) / rate * (1 + rate);
}
function fmt(n) { return Math.round(n).toLocaleString('th-TH'); }
function fmtCurr(n) { return '฿' + fmt(n); }
function fmtShort(n) {
  if (Math.abs(n) >= 1e6) return '฿' + (n/1e6).toFixed(1) + 'M';
  if (Math.abs(n) >= 1e3) return '฿' + Math.round(n/1e3) + 'K';
  return '฿' + Math.round(n);
}
function _parseNum(s) {
  if (s == null) return 0;
  const n = Number(String(s).replace(/[^\d.\-]/g,''));
  return isFinite(n) ? n : 0;
}
function _fmtInput(n) {
  if (!n || !isFinite(n)) return '';
  return Math.round(Number(n)).toLocaleString('th-TH');
}
function _annualContrib(a) {
  const v = Number(a.contribution || 0);
  return a.contribFreq === 'monthly' ? v * 12 : v;
}

function getOrEmpty(type) {
  const a = getAssets().find(x => x.type === type && !x.customCategory);
  if (a) return a;
  const t = ASSET_TYPES[type] || ASSET_TYPES.other;
  return { id: '__stub:' + type, type, name: t.label, isStub: true,
    currentValue: 0, contribution: 0, contribFreq: 'annual',
    expectedReturn: 0, term: 0, cashFlow: 0 };
}

function ensureAsset(type) {
  const existing = getAssets().find(x => x.type === type && !x.customCategory);
  if (existing) return existing.id;
  let newId;
  updateUser(u => {
    const c = (u.data.clients||[]).find(x => x.id === selectedClientId);
    if (!c) return;
    if (!c.assets) c.assets = [];
    const t = ASSET_TYPES[type] || ASSET_TYPES.other;
    newId = 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
    c.assets.push({
      id: newId, type, name: t.label,
      currentValue: 0, contribution: 0, contribFreq: 'annual',
      expectedReturn: 0, term: 0, cashFlow: 0,
      createdAt: new Date().toISOString(),
    });
  });
  return newId;
}

function onFieldChange(id, field, value) {
  let v;
  if (field === 'expectedReturn' || field === 'term') v = Number(value) || 0;
  else if (field === 'name') v = String(value || '');
  else v = _parseNum(value);
  updateUser(u => {
    const c = (u.data.clients||[]).find(x => x.id === selectedClientId);
    if (!c || !c.assets) return;
    const a = c.assets.find(x => x.id === id);
    if (!a) return;
    a[field] = v;
    if (!a.contribFreq) a.contribFreq = 'annual';
  });
  updateLivePreview(id);
  updateTotals();
}

function onAssetFieldChange(id, field, value) {
  if (id.startsWith('__stub:')) {
    const type = id.slice(7);
    const newId = ensureAsset(type);
    expandedId = newId;
    onFieldChange(newId, field, value);
    renderAll();
    setTimeout(() => {
      const card = document.querySelector(`[data-card-id="${newId}"]`);
      if (card) card.querySelector('input')?.focus();
    }, 30);
    return;
  }
  onFieldChange(id, field, value);
}

function updateLivePreview(id) {
  const a = getAssets().find(x => x.id === id);
  if (!a) return;
  const fv = calcFV(a.currentValue, a.expectedReturn, a.term, a.contribution, a.contribFreq||'annual');
  const fvEl = document.querySelector(`[data-fv-id="${id}"]`);
  if (fvEl) {
    fvEl.textContent = fmtCurr(fv);
    fvEl.classList.add('pulse');
    setTimeout(() => fvEl.classList.remove('pulse'), 400);
  }
  const cfEl = document.querySelector(`[data-cf-id="${id}"]`);
  if (cfEl) {
    cfEl.textContent = fmtCurr(a.cashFlow||0);
    cfEl.classList.add('pulse');
    setTimeout(() => cfEl.classList.remove('pulse'), 400);
  }
}

function setApplyTo(id, value) {
  updateUser(u => {
    const c = (u.data.clients||[]).find(x => x.id === selectedClientId);
    if (!c || !c.assets) return;
    const a = c.assets.find(x => x.id === id);
    if (!a) return;
    if (value === null) delete a.appliedTo;
    else a.appliedTo = value;
  });
  renderAll();
}

function addCustomRow(category) {
  if (!selectedClientId) return;
  let newId;
  updateUser(u => {
    const c = (u.data.clients||[]).find(x => x.id === selectedClientId);
    if (!c) return;
    if (!c.assets) c.assets = [];
    newId = 'cust-' + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
    c.assets.push({
      id: newId, type:'other', customCategory:category, name:'',
      currentValue: 0, contribution: 0, contribFreq: 'annual',
      expectedReturn: 0, term: 0, cashFlow: 0,
      createdAt: new Date().toISOString(),
    });
  });
  expandedId = newId;
  renderAll();
}
function deleteAsset(id) {
  if (!confirm('ลบรายการนี้?')) return;
  updateUser(u => {
    const c = (u.data.clients||[]).find(x => x.id === selectedClientId);
    if (c && c.assets) c.assets = c.assets.filter(a => a.id !== id);
  });
  if (expandedId === id) expandedId = null;
  renderAll();
}

function toggleExpand(id) {
  expandedId = (expandedId === id) ? null : id;
  renderAll();
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter-chip').forEach(b => b.classList.toggle('active', b.dataset.filter === f));
  applyFilters();
}
function applyFilters() {
  const q = (document.getElementById('asset-search')?.value || '').toLowerCase().trim();
  document.querySelectorAll('.asset-card').forEach(card => {
    const cat = card.dataset.cat;
    const name = (card.dataset.name || '').toLowerCase();
    const matchFilter = currentFilter === 'all' || cat === currentFilter;
    const matchSearch = !q || name.includes(q);
    card.classList.toggle('hidden', !(matchFilter && matchSearch));
  });
}

function initClientSelect() {
  const sel = document.getElementById('client-select');
  const clients = getClients();
  if (clients.length === 0) {
    sel.innerHTML = '<option value="">— ไม่มีลูกค้า —</option>';
    return;
  }
  const stored = localStorage.getItem('aia_selectedClient');
  selectedClientId = (stored && clients.find(c => c.id === stored)) ? stored : clients[0].id;
  localStorage.setItem('aia_selectedClient', selectedClientId);
  sel.innerHTML = clients.map(c =>
    `<option value="${c.id}" ${c.id === selectedClientId ? 'selected':''}>${c.firstName||''} ${c.lastName||''}</option>`
  ).join('');
  const cur = clients.find(c => c.id === selectedClientId);
  const av = document.getElementById('client-av');
  if (av && cur) av.textContent = (cur.firstName||'?').charAt(0).toUpperCase();
}
function onClientChange(cid) {
  selectedClientId = cid;
  localStorage.setItem('aia_selectedClient', cid);
  expandedId = null;
  renderAll();
}

function renderAssetCard(a, cat, totalCV) {
  const isCustom = !!a.customCategory;
  const isStub = a.isStub;
  const t = ASSET_TYPES[a.type] || ASSET_TYPES.other;
  const fields = isCustom
    ? { contrib: true, term: a.customCategory === 'fv', fv: a.customCategory === 'fv', cashFlow: a.customCategory === 'cf' }
    : _rowFields(a.type);
  const cv = a.currentValue || 0;
  const co = a.contribution || 0;
  const er = a.expectedReturn || 0;
  const tm = a.term || 0;
  const cf = a.cashFlow || 0;
  const annualCo = _annualContrib(a);
  const fv = calcFV(cv, er, tm, co, a.contribFreq || 'annual');
  const expanded = expandedId === a.id;
  const sharePct = totalCV > 0 ? (cv / totalCV) * 100 : 0;
  const displayName = isCustom ? (a.name || (a.customCategory === 'fv' ? 'รายการมูลค่าอนาคต' : 'รายการกระแสเงินสด')) : t.label;
  const appliedLabel = a.appliedTo === 'retire' ? 'เกษียณ' : a.appliedTo === 'education' ? 'การศึกษา' : '';

  return `
    <div class="asset-card ${expanded?'expanded':''}"
         data-card-id="${a.id}"
         data-cat="${cat}"
         data-name="${displayName.replace(/"/g,'&quot;').toLowerCase()}"
         onclick="if(!event.target.closest('.editor, input, button, select')) toggleExpand('${a.id}')"
         onmousemove="this.style.setProperty('--mx', (event.offsetX/this.offsetWidth*100)+'%'); this.style.setProperty('--my', (event.offsetY/this.offsetHeight*100)+'%');">
      <div class="asset-head">
        <div class="asset-glyph">${t.icon}</div>
        <div class="asset-title-wrap">
          <div class="asset-title">${displayName}</div>
          <div class="asset-tags">
            ${a.type === 'pvd' ? '<span class="asset-tag">PVD</span>' : ''}
            ${isCustom ? `<span class="asset-tag">${a.customCategory === 'fv' ? 'FV' : 'CF'}</span>` : ''}
            ${appliedLabel ? `<span class="asset-tag applied">${appliedLabel}</span>` : ''}
          </div>
        </div>
      </div>

      <div class="asset-value-row">
        <div class="lbl">มูลค่าปัจจุบัน</div>
        <div class="asset-value-amt ${cv?'':'empty'}">${cv ? fmtCurr(cv) : 'ยังไม่ระบุ'}</div>
      </div>

      <div class="asset-progress"><div class="asset-progress-fill" style="width:${Math.min(sharePct,100)}%"></div></div>

      <div class="asset-stats">
        ${fields.fv ? `
          <div class="stat-mini">
            <div class="l">FV</div>
            <div class="v ${fv?'mint':'dim'}">${fv ? fmtShort(fv) : '—'}</div>
          </div>` : ''}
        ${fields.contrib ? `
          <div class="stat-mini">
            <div class="l">ออม/ปี</div>
            <div class="v ${annualCo?'':'dim'}">${annualCo ? fmtShort(annualCo) : '—'}</div>
          </div>` : ''}
        ${fields.cashFlow ? `
          <div class="stat-mini">
            <div class="l">CF/ปี</div>
            <div class="v ${cf?'mint':'dim'}">${cf ? fmtShort(cf) : '—'}</div>
          </div>` : ''}
        <div class="stat-mini">
          <div class="l">RETURN</div>
          <div class="v ${er?'':'dim'}">${er ? er.toFixed(1)+'%' : '—'}</div>
        </div>
      </div>

      <!-- Editor -->
      <div class="editor">
        ${isCustom ? `
          <input type="text" class="ed-name-input"
                 value="${(a.name||'').replace(/"/g,'&quot;')}"
                 placeholder="${a.customCategory === 'fv' ? 'ชื่อรายการ (เช่น เงินบำเหน็จ)' : 'ชื่อรายการ (เช่น ค่าเช่ารายปี)'}"
                 onchange="onAssetFieldChange('${a.id}','name',this.value)">
        ` : ''}

        <div class="editor-fields">
          <div class="ed-field">
            <label>มูลค่าปัจจุบัน</label>
            <div class="ed-input-wrap">
              <input type="text" inputmode="decimal" class="ed-input has-suffix"
                     value="${cv ? _fmtInput(cv) : ''}" placeholder="0"
                     onfocus="this.value=this.value.replace(/,/g,''); this.select();"
                     onblur="this.value=this.value?Number(this.value.replace(/,/g,'')).toLocaleString('th-TH'):''; onAssetFieldChange('${a.id}','currentValue',this.value);">
              <span class="ed-suffix">฿</span>
            </div>
          </div>

          ${fields.contrib ? `
            <div class="ed-field">
              <label>ออมเพิ่ม/ปี</label>
              <div class="ed-input-wrap">
                <input type="text" inputmode="decimal" class="ed-input has-suffix"
                       value="${co ? _fmtInput(co) : ''}" placeholder="0"
                       onfocus="this.value=this.value.replace(/,/g,''); this.select();"
                       onblur="this.value=this.value?Number(this.value.replace(/,/g,'')).toLocaleString('th-TH'):''; onAssetFieldChange('${a.id}','contribution',this.value);">
                <span class="ed-suffix">฿</span>
              </div>
            </div>
          ` : ''}

          <div class="ed-field">
            <label>ผลตอบแทน/ปี</label>
            <div class="ed-input-wrap">
              <input type="number" step="0.01" class="ed-input has-suffix"
                     value="${er || ''}" placeholder="0"
                     onchange="onAssetFieldChange('${a.id}','expectedReturn',this.value)">
              <span class="ed-suffix">%</span>
            </div>
          </div>

          ${fields.term ? `
            <div class="ed-field">
              <label>ระยะเวลา</label>
              <div class="ed-input-wrap">
                <input type="number" min="0" step="1" class="ed-input has-suffix"
                       value="${tm || ''}" placeholder="0"
                       onchange="onAssetFieldChange('${a.id}','term',this.value)">
                <span class="ed-suffix">ปี</span>
              </div>
            </div>
          ` : ''}

          ${fields.cashFlow ? `
            <div class="ed-field">
              <label>กระแสเงินสด/ปี</label>
              <div class="ed-input-wrap">
                <input type="text" inputmode="decimal" class="ed-input has-suffix"
                       value="${cf ? _fmtInput(cf) : ''}" placeholder="0"
                       onfocus="this.value=this.value.replace(/,/g,''); this.select();"
                       onblur="this.value=this.value?Number(this.value.replace(/,/g,'')).toLocaleString('th-TH'):''; onAssetFieldChange('${a.id}','cashFlow',this.value);">
                <span class="ed-suffix">฿</span>
              </div>
            </div>
          ` : ''}
        </div>

        ${fields.fv ? `
          <div class="ed-preview">
            <div class="info">
              <div class="lbl">FUTURE VALUE</div>
              <div class="amt" data-fv-id="${a.id}">${fmtCurr(fv)}</div>
            </div>
            <div class="meta">เมื่อครบ <b>${tm || 0}</b> ปี · ที่ <b>${er || 0}%</b>/ปี</div>
          </div>
        ` : fields.cashFlow ? `
          <div class="ed-preview cf">
            <div class="info">
              <div class="lbl">CASH FLOW / YEAR</div>
              <div class="amt" data-cf-id="${a.id}">${fmtCurr(cf)}</div>
            </div>
            <div class="meta">รายได้ประจำต่อปี</div>
          </div>
        ` : ''}

        <div class="apply-row">
          <label>นำไปใช้กับ:</label>
          <button class="apply-pill ${a.appliedTo==='retire'?'active':''}" onclick="setApplyTo('${a.id}','retire')">🛋️ แผนเกษียณ</button>
          <button class="apply-pill ${a.appliedTo==='education'?'active':''}" onclick="setApplyTo('${a.id}','education')">🎓 แผนการศึกษาบุตร</button>
          <button class="apply-pill ${!a.appliedTo?'active':''}" onclick="setApplyTo('${a.id}',null)">− ไม่ระบุ</button>
        </div>

        <div class="ed-actions">
          ${!isStub ? `<button class="ed-btn danger" onclick="deleteAsset('${a.id}')">ลบ</button>` : ''}
          <button class="ed-btn primary" onclick="expandedId=null; renderAll();">✓ เสร็จสิ้น</button>
        </div>
      </div>
    </div>
  `;
}

function renderAll() {
  const wrap = document.getElementById('content-wrap');
  if (!selectedClientId) {
    wrap.innerHTML = `
      <div class="empty-state">
        <div class="ico">👤</div>
        <h3>ยังไม่มีลูกค้าในระบบ</h3>
        <p>กรุณาเพิ่มลูกค้าเพื่อเริ่มต้น</p>
        <a href="clients.html">→ เพิ่มลูกค้า</a>
      </div>`;
    document.getElementById('dock').style.display = 'none';
    return;
  }

  const allAssets = getAssets();
  const savingsAssets = SAVINGS_TYPES.map(getOrEmpty);
  const investAssets = INVESTMENT_TYPES.map(getOrEmpty);
  const customAssets = allAssets.filter(a => a.customCategory);

  const sumCV = (list) => list.reduce((s,a) => s + Number(a.currentValue||0), 0);
  const sumFV = (list) => list.reduce((s,a) => s + calcFV(a.currentValue, a.expectedReturn, a.term, a.contribution, a.contribFreq||'annual'), 0);
  const sumCF = (list) => list.reduce((s,a) => s + Number(a.cashFlow||0), 0);
  const sumContrib = (list) => list.reduce((s,a) => s + _annualContrib(a), 0);

  const cvSav = sumCV(savingsAssets);
  const cvInv = sumCV(investAssets);
  const cvCust = sumCV(customAssets);
  const totalCV = cvSav + cvInv + cvCust;
  const totalFV = sumFV(allAssets);
  const totalCF = sumCF(allAssets);
  const totalContrib = sumContrib(allAssets);

  const pSav = totalCV > 0 ? cvSav/totalCV*100 : 0;
  const pInv = totalCV > 0 ? cvInv/totalCV*100 : 0;
  const pCust = totalCV > 0 ? cvCust/totalCV*100 : 0;

  /* Bento + sections */
  const C = 502.4; // 2*π*80
  wrap.innerHTML = `
    <!-- Bento Top -->
    <div class="bento fade-in d2">
      <div class="bento-cell cell-donut">
        <div class="donut-svg">
          <svg viewBox="0 0 180 180">
            <circle cx="90" cy="90" r="80" fill="none" stroke="rgba(255,255,255,.05)" stroke-width="14"/>
            <circle class="donut-arc" cx="90" cy="90" r="80" stroke="url(#g-sav)"
                    stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pSav/100)}" id="arc-sav"/>
            <circle class="donut-arc" cx="90" cy="90" r="80" stroke="url(#g-inv)"
                    stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pInv/100)}" id="arc-inv"
                    transform="rotate(${360*pSav/100} 90 90)"/>
            <circle class="donut-arc" cx="90" cy="90" r="80" stroke="url(#g-cust)"
                    stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pCust/100)}" id="arc-cust"
                    transform="rotate(${360*(pSav+pInv)/100} 90 90)"/>
            <defs>
              <linearGradient id="g-sav" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#F2D7A7"/><stop offset="100%" stop-color="#D4A574"/>
              </linearGradient>
              <linearGradient id="g-inv" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#93C5FD"/><stop offset="100%" stop-color="#60A5FA"/>
              </linearGradient>
              <linearGradient id="g-cust" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#C4B5FD"/><stop offset="100%" stop-color="#8B5CF6"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div class="donut-legend">
          <div class="cell-eyebrow" style="margin-bottom:14px;">การกระจายสินทรัพย์</div>
          <div class="donut-row">
            <div class="dot" style="background:#F2D7A7"></div>
            <div class="lbl">เงินออม</div>
            <div class="val">${fmtCurr(cvSav)}</div>
            <div class="pct">${pSav.toFixed(0)}%</div>
          </div>
          <div class="donut-row">
            <div class="dot" style="background:#93C5FD"></div>
            <div class="lbl">เงินลงทุน</div>
            <div class="val">${fmtCurr(cvInv)}</div>
            <div class="pct">${pInv.toFixed(0)}%</div>
          </div>
          ${customAssets.length > 0 ? `
            <div class="donut-row">
              <div class="dot" style="background:#C4B5FD"></div>
              <div class="lbl">เพิ่มเอง</div>
              <div class="val">${fmtCurr(cvCust)}</div>
              <div class="pct">${pCust.toFixed(0)}%</div>
            </div>
          ` : ''}
        </div>
      </div>

      <div class="bento-cell cell-savings">
        <div class="cell-eyebrow">เงินออม</div>
        <div class="cell-value lg">${fmtCurr(cvSav)}</div>
        <div class="cell-sub"><b>${SAVINGS_TYPES.length}</b> ประเภท · ความเสี่ยงต่ำ</div>
      </div>
      <div class="bento-cell cell-invest">
        <div class="cell-eyebrow">เงินลงทุน</div>
        <div class="cell-value lg">${fmtCurr(cvInv)}</div>
        <div class="cell-sub"><b>${INVESTMENT_TYPES.length}</b> ประเภท · เติบโต</div>
      </div>
      <div class="bento-cell cell-fv">
        <div class="cell-eyebrow">มูลค่าอนาคต (FV)</div>
        <div class="cell-value lg" style="color:var(--mint);">${fmtCurr(totalFV)}</div>
        <div class="cell-sub">ออม <b>${fmtCurr(totalContrib)}</b>/ปี</div>
      </div>
      <div class="bento-cell cell-cf">
        <div class="cell-eyebrow">CF / ปี</div>
        <div class="cell-value md" style="color:var(--violet);">${fmtCurr(totalCF)}</div>
        <div class="cell-sub">รายได้ประจำ</div>
      </div>
    </div>

    <!-- Section: Assets Grid -->
    <div class="section-divider fade-in d3">
      <div class="section-num">/ 01</div>
      <div class="section-title">รายการสินทรัพย์</div>
      <div class="section-line"></div>
    </div>

    <div class="filter-row fade-in d3">
      <button class="filter-chip active" data-filter="all" onclick="setFilter('all')">ทั้งหมด <span class="ct">${SAVINGS_TYPES.length + INVESTMENT_TYPES.length + customAssets.length}</span></button>
      <button class="filter-chip" data-filter="savings" onclick="setFilter('savings')">💰 เงินออม <span class="ct">${SAVINGS_TYPES.length}</span></button>
      <button class="filter-chip" data-filter="invest" onclick="setFilter('invest')">📈 เงินลงทุน <span class="ct">${INVESTMENT_TYPES.length}</span></button>
      ${customAssets.length > 0 ? `<button class="filter-chip" data-filter="custom" onclick="setFilter('custom')">📦 เพิ่มเอง <span class="ct">${customAssets.length}</span></button>` : ''}
      <div class="filter-spacer"></div>
      <div class="filter-search">
        <input type="search" id="asset-search" placeholder="ค้นหา..." oninput="applyFilters()">
      </div>
    </div>

    <div class="asset-grid fade-in d4">
      ${savingsAssets.map(a => renderAssetCard(a, 'savings', totalCV)).join('')}
      ${investAssets.map(a => renderAssetCard(a, 'invest', totalCV)).join('')}
      ${customAssets.map(a => renderAssetCard(a, 'custom', totalCV)).join('')}
    </div>

    <!-- Add zone -->
    <div class="section-divider">
      <div class="section-num">/ 02</div>
      <div class="section-title">เพิ่มรายการ Custom</div>
      <div class="section-line"></div>
    </div>

    <div class="add-zone">
      <div class="add-card fv" onclick="addCustomRow('fv')">
        <div class="icon">📈</div>
        <div class="text">
          <div class="t1">เพิ่มมูลค่าอนาคต</div>
          <div class="t2">รายการที่จะคำนวณ FV (เช่น เงินบำเหน็จ)</div>
        </div>
      </div>
      <div class="add-card cf" onclick="addCustomRow('cf')">
        <div class="icon">💵</div>
        <div class="text">
          <div class="t1">เพิ่มกระแสเงินสด</div>
          <div class="t2">รายได้ประจำที่ได้รับเป็นเงินสด</div>
        </div>
      </div>
    </div>
  `;

  /* Update hero + dock */
  animateNumber('hero-total', totalCV, true);
  document.getElementById('dock').style.display = 'flex';
  document.getElementById('dock-cv').textContent = fmtCurr(totalCV);
  document.getElementById('dock-fv').textContent = fmtCurr(totalFV);
  document.getElementById('dock-cf').textContent = fmtCurr(totalCF);

  applyFilters();
}

function updateTotals() {
  const allAssets = getAssets();
  const customAssets = allAssets.filter(a => a.customCategory);
  const sumCV = (list) => list.reduce((s,a) => s + Number(a.currentValue||0), 0);
  const sumFV = (list) => list.reduce((s,a) => s + calcFV(a.currentValue, a.expectedReturn, a.term, a.contribution, a.contribFreq||'annual'), 0);
  const sumCF = (list) => list.reduce((s,a) => s + Number(a.cashFlow||0), 0);
  const savingsAssets = SAVINGS_TYPES.map(getOrEmpty);
  const investAssets = INVESTMENT_TYPES.map(getOrEmpty);
  const cvSav = sumCV(savingsAssets);
  const cvInv = sumCV(investAssets);
  const cvCust = sumCV(customAssets);
  const totalCV = cvSav + cvInv + cvCust;
  const totalFV = sumFV(allAssets);
  const totalCF = sumCF(allAssets);
  animateNumber('hero-total', totalCV, true);
  document.getElementById('dock-cv').textContent = fmtCurr(totalCV);
  document.getElementById('dock-fv').textContent = fmtCurr(totalFV);
  document.getElementById('dock-cf').textContent = fmtCurr(totalCF);
}

function animateNumber(elId, target, withCurrencySymbol) {
  const el = document.getElementById(elId);
  if (!el) return;
  const txt = el.textContent || '';
  const current = Number(txt.replace(/[^\d.\-]/g,'')) || 0;
  if (current === target) {
    el.innerHTML = withCurrencySymbol
      ? `<span class="currency">฿</span>${fmt(target)}`
      : fmtCurr(target);
    return;
  }
  const duration = 900;
  const start = performance.now();
  function tick(now) {
    const t = Math.min((now - start) / duration, 1);
    const eased = 1 - Math.pow(1 - t, 3);
    const v = current + (target - current) * eased;
    el.innerHTML = withCurrencySymbol
      ? `<span class="currency">฿</span>${fmt(v)}`
      : fmtCurr(v);
    if (t < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

fbAuth.onAuthStateChanged(user => {
  if (!user) { localStorage.removeItem('aia_currentUser'); location.href = 'login.html'; }
});

(function init() {
  initClientSelect();
  renderAll();
  window.addEventListener('storage', (e) => {
    if (e.key === 'aia_users') { initClientSelect(); renderAll(); }
  });
})();
</script>
